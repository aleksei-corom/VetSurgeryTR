[package]
name = "vetsurgerytr"
version = "1.0.1"
description = "Sistema de gestión de cirugía ortopédica veterinaria (Firebird 5 Embedded)"
authors = ["VetSurgeryTR"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vetsurgerytr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# Diálogos nativos (selector de carpeta para exportar CSV).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Hash de contraseñas (Argon2id) para el acceso local multiusuario.
argon2 = { version = "0.5", features = ["std"] }
# `rand_core` con OsRng para generar sales aleatorias del hash.
password-hash = { version = "0.5", features = ["rand_core"] }

# Utilidades de fecha: formateo ISO de las fechas Firebird y ventanas del
# dashboard (últimos 6 meses, mes en curso).
chrono = "0.4"

# Esperas no bloqueantes (quiesce del pool durante el respaldo).
tokio = { version = "1", default-features = false, features = ["time"] }

# ---- Firebird 5 Embedded ----
# `dynamic_loading` localiza fbclient.dll/libfbclient.so en tiempo de
# ejecución (incluida en src-tauri/binaries/firebird/ y empaquetada como
# recurso). Sin `linking` para no requerir la librería al compilar.
rsfbclient = { version = "0.27", default-features = false, features = ["dynamic_loading"] }

[dev-dependencies]
# Runtime async para invocar comandos #[tauri::command] desde los tests E2E
# (los comandos son async).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# Runtime mock de Tauri: permite app.manage(state) y State real en tests.
tauri = { version = "2", features = ["protocol-asset", "test"] }

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.package."*"]
incremental = false
codegen-units = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

